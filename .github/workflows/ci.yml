name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write license file
        run: |
          mkdir -p secrets
          echo '${{ secrets.NORSK_LICENSE }}' > secrets/license.json

      - name: Run bash unit tests
        id: tests
        run: |
          ./test/run-all.sh --unit-only 2>&1 | tee unit-output.txt
          # Parse results for summary
          UNIT_OUTPUT_CLEAN=$(cat unit-output.txt | sed 's/\x1b\[[0-9;]*m//g')
          UNIT_TOTAL=$(echo "$UNIT_OUTPUT_CLEAN" | grep -oP 'Tests run: \K\d+' | paste -sd+ | bc 2>/dev/null || echo "0")
          UNIT_PASSED=$(echo "$UNIT_OUTPUT_CLEAN" | grep -oP 'Passed: \K\d+' | paste -sd+ | bc 2>/dev/null || echo "0")
          UNIT_FAILED=$((UNIT_TOTAL - UNIT_PASSED))
          echo "passed=$UNIT_PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$UNIT_FAILED" >> "$GITHUB_OUTPUT"
          # Write JSON for aggregation
          jq -n --argjson passes "$UNIT_PASSED" --argjson failures "$UNIT_FAILED" \
            '{stats: {passes: $passes, failures: $failures}, failures: []}' > unit-results.json

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: unit-results.json

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: cd test && npm install

      - name: Write license file
        run: |
          mkdir -p secrets
          echo '${{ secrets.NORSK_LICENSE }}' > secrets/license.json

      - name: Pull containers
        run: |
          source versions
          docker pull $NORSK_MEDIA_IMAGE
          docker pull $NORSK_STUDIO_IMAGE

      - name: Run integration tests
        id: tests
        run: |
          cd test
          npm run test:integration:json 2>&1 | tee integration-output.txt || true
          # Ensure file exists
          if [[ ! -s integration-results.json ]]; then
            echo '{"stats": {"passes": 0, "failures": 1}, "failures": [{"fullTitle": "Tests failed to run"}]}' > integration-results.json
          fi
        timeout-minutes: 25

      - name: Dump container logs
        if: always()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a
          echo ""
          echo "=== norsk-media logs ==="
          docker logs norsk-media 2>&1 | tail -100 || echo "No norsk-media container"
          echo ""
          echo "=== norsk-studio logs ==="
          docker logs norsk-studio 2>&1 | tail -100 || echo "No norsk-studio container"
          echo ""
          echo "=== Test output ==="
          cat test/integration-output.txt 2>/dev/null || echo "No test output file"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            test/integration-results.json
            test/integration-output.txt

  # Discord, in the id3as house style (id3as/ci-workflows: README "The house style" and
  # actions/discord-notify): "Jankings", a happy pony on success and a sad one otherwise
  # (theponyapi thumbSmall, fixed fallback), green 5763719 / red 15548997 / amber 15844367,
  # ✅/❌/⚠️, and the "[repo/ref](run)" / "[Run #id](run)" header. It is built inline here because
  # this repo is in the norskvideo org and cannot use ci-workflows' private discord-notify action
  # (its access setting covers id3as-owned repos only). Keep it in step with that action.
  # Posts on pushes to main only; pull requests get the job summary.
  notify:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Download unit results
        uses: actions/download-artifact@v4
        with:
          name: unit-results
          path: results
        continue-on-error: true

      - name: Download integration results
        uses: actions/download-artifact@v4
        with:
          name: integration-results
          path: results
        continue-on-error: true

      # A job that ran but left no results failed before reporting: say so, never "skipped" or green.
      # A cancelled job is reported as cancelled (amber), never as a failure.
      - name: Create default results if missing
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INT_RESULT: ${{ needs.integration-tests.result }}
        run: |
          mkdir -p results
          died() {
            if [[ "$2" == "cancelled" ]]; then
              echo '{"stats": {"passes": 0, "failures": 0, "cancelled": true}, "failures": []}'
            else
              jq -n --arg why "$1 job $2 before reporting results" \
                '{stats: {passes: 0, failures: 1}, failures: [{fullTitle: $why}]}'
            fi
          }
          if [[ ! -f results/unit-results.json ]]; then
            died unit-tests "$UNIT_RESULT" > results/unit-results.json
          fi
          if [[ ! -f results/integration-results.json ]]; then
            if [[ "$INT_RESULT" == "skipped" ]]; then
              echo '{"stats": {"passes": 0, "failures": 0, "skipped": true}, "failures": []}' > results/integration-results.json
            else
              died integration-tests "$INT_RESULT" > results/integration-results.json
            fi
          fi

      - name: Gather commits
        id: commits
        env:
          PAYLOAD: ${{ toJson(github.event.commits) }}
        run: |
          {
            echo "commits<<EOF"
            if [ "$PAYLOAD" = "null" ] || [ -z "$PAYLOAD" ]; then
              echo ""
            else
              echo "$PAYLOAD" | jq -r '([.[] | ("- " + .id[0:6] + " " + .message + " - " + .author.username)] | join("\n"))'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # success: no failures; failure: any failure; warn: integration skipped; cancelled: a job was
      # cancelled (amber, never red or green).
      - name: Status
        id: status
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INT_RESULT: ${{ needs.integration-tests.result }}
        run: |
          UNIT_FAILURES=$(jq -r '.stats.failures // 0' results/unit-results.json)
          INT_FAILURES=$(jq -r '.stats.failures // 0' results/integration-results.json)
          INT_SKIPPED=$(jq -r '.stats.skipped // false' results/integration-results.json)
          if [[ "$UNIT_RESULT" == "cancelled" || "$INT_RESULT" == "cancelled" ]]; then
            STATUS=cancelled
          elif [[ "$UNIT_FAILURES" -gt 0 || ( "$INT_SKIPPED" != "true" && "$INT_FAILURES" -gt 0 ) ]]; then
            STATUS=failure
          elif [[ "$INT_SKIPPED" == "true" ]]; then
            STATUS=warn
          else
            STATUS=success
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Get pony avatar
        id: pony
        env:
          STATUS: ${{ steps.status.outputs.status }}
        run: |
          FALLBACK="https://pones.theponyapi.com/file/ponies/5201928829009920/thumb_small"
          if [[ "$STATUS" == "success" ]]; then QUERY="happy"; else QUERY="sad"; fi
          PONY_URL=$(curl -sSf -m 10 -H 'Accept: application/json' \
            "https://theponyapi.com/api/v1/pony/random?q=$QUERY" 2>/dev/null \
            | jq -r '.pony.representations.thumbSmall // empty' 2>/dev/null || true)
          echo "url=${PONY_URL:-$FALLBACK}" >> "$GITHUB_OUTPUT"

      - name: Generate summaries
        env:
          COMMITS: ${{ steps.commits.outputs.commits }}
          STATUS: ${{ steps.status.outputs.status }}
          PONY_URL: ${{ steps.pony.outputs.url }}
        run: |
          cd results
          # Generate Discord payload
          cat unit-results.json integration-results.json | jq -s \
            --arg GITHUB_REF "${GITHUB_REF:-local}" \
            --arg GITHUB_RUN_ID "${GITHUB_RUN_ID:-0}" \
            --arg GITHUB_REPOSITORY "${GITHUB_REPOSITORY:-norskvideo/norsk-studio-docker}" \
            --arg GITHUB_SERVER_URL "${GITHUB_SERVER_URL:-https://github.com}" \
            --arg STATUS "$STATUS" \
            --arg PONY_URL "$PONY_URL" \
            --arg COMMITS "$COMMITS" \
          '
          def green: 5763719; def red: 15548997; def amber: 15844367;
          def cap: if length > 4000 then .[0:4000] + "\n… (cut; see the run)" else . end;
          def failed($r): if ($r.failures | length) > 0
              then "\n**Failed:**\n- " + ([$r.failures[].fullTitle] | join("\n- ")) else "" end;
          def suite($name; $r):
              if $r.stats.cancelled then {color: amber, description: ("**" + $name + ":** cancelled")}
              elif $r.stats.skipped then {color: amber, description: ("**" + $name + ":** skipped")}
              else {color: (if $r.stats.failures == 0 then green else red end),
                    description: ("**" + $name + ":** " + ($r.stats.passes | tostring) + " passed"
                      + (if $r.stats.failures > 0 then ", " + ($r.stats.failures | tostring) + " failed" + failed($r) else "" end))}
              end;
          ($GITHUB_SERVER_URL + "/" + $GITHUB_REPOSITORY + "/actions/runs/" + $GITHUB_RUN_ID) as $run
          | ($GITHUB_REPOSITORY | split("/") | last) as $repo
          | {success: {emoji: "✅", color: green}, failure: {emoji: "❌", color: red},
             warn: {emoji: "⚠️", color: amber}, cancelled: {emoji: "⚠️", color: amber}}[$STATUS] as $s
          |
          {
            "content": "",
            "avatar_url": $PONY_URL,
            "username": "Jankings",
            "embeds": ([
              (suite("Unit Tests"; .[0]) | .description = ((
                "[" + $repo + "/" + $GITHUB_REF + "](" + $run + ")\n"
                + "[Run #" + $GITHUB_RUN_ID + "](" + $run + ")\n\n"
                + "**" + $repo + "** " + $s.emoji + "\n"
                + .description) | cap)),
              (suite("Integration Tests"; .[1]) | .description |= cap)
            ] + (if $COMMITS != "" then [{
              "color": $s.color,
              "description": (("**Changes:**\n" + $COMMITS) | cap)
            }] else [] end))
          }' > discord.json

          # Generate GitHub step summary
          cat unit-results.json integration-results.json | jq -r -s \
            --arg COMMITS "$COMMITS" \
          '"## Test Results\n\n" +
          "| Suite | Passed | Failed |\n" +
          "|-------|--------|--------|\n" +
          "| Unit Tests | " + (.[0].stats.passes | tostring) + " | " + (.[0].stats.failures | tostring) + " |\n" +
          (if .[1].stats.skipped then
            "| Integration Tests | - | skipped |\n"
          else
            "| Integration Tests | " + (.[1].stats.passes | tostring) + " | " + (.[1].stats.failures | tostring) + " |\n"
          end) +
          "\n" +
          (if (.[0].stats.failures > 0 or (.[1].stats.failures > 0 and (.[1].stats.skipped | not))) then
            "### Failed Tests\n\n" +
            (if .[1].stats.failures > 0 then
              ([.[1].failures[].fullTitle] | map("- " + .) | join("\n")) + "\n"
            else "" end)
          else
            "All tests passed! :white_check_mark:\n"
          end) +
          (if $COMMITS != "" then
            "\n### Changes\n\n" + $COMMITS + "\n"
          else "" end)' >> "$GITHUB_STEP_SUMMARY"

      - name: Discord notification
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
        run: |
          if [[ -f results/discord.json && -n "$DISCORD_URL" ]]; then
            curl -sS --fail-with-body --retry 3 --retry-connrefused --retry-delay 2 \
              -H "Content-Type: application/json" \
              -d @results/discord.json \
              "$DISCORD_URL"
          else
            echo "Skipping Discord notification (no webhook or results file)"
          fi
